CONFIG_BT_CTLR_TX_PWR_PLUS_8=y       # Boost BT signal strength
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n # Don't clear bonds on start
CONFIG_ZMK_SLEEP=y                     # Make sure sleep is enabled/configured
CONFIG_ZMK_IDLE_TIMEOUT=60000          # ms before idle (default is 30000)
CONFIG_ZMK_SLEEP_IDLE_TIMEOUT=900000   # ms before deep sleep (15 min)
